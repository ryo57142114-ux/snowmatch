function shrinkImage(file,maxSide,cb){
  var fr=new FileReader();
  fr.onload=function(ev){
    var im=new Image();
    im.onload=function(){
      var w=im.width,h=im.height,sc=Math.min(1,maxSide/Math.max(w,h));
      var cv=document.createElement("canvas");cv.width=Math.round(w*sc);cv.height=Math.round(h*sc);
      cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
      cv.toBlob(function(bl){cb(bl,cv.toDataURL("image/jpeg",0.6));},"image/jpeg",0.82);
    };
    im.onerror=function(){alert("この画像は読み込めませんでした");};
    im.src=ev.target.result;
  };
  fr.readAsDataURL(file);
}

// ===== プロフィールの投稿（写真・動画リンク・テキスト）をサーバーに保存 =====
function dataUrlToJpeg(dataUrl,maxSide,cb){
  var im=new Image();
  im.onload=function(){var w=im.width,h=im.height,sc=Math.min(1,maxSide/Math.max(w,h));var cv=document.createElement("canvas");cv.width=Math.round(w*sc);cv.height=Math.round(h*sc);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);cv.toBlob(function(bl){cb(bl);},"image/jpeg",0.85);};
  im.onerror=function(){cb(null);};
  im.src=dataUrl;
}
function savePostToServer(post){
  return new Promise(function(resolve,reject){
    function ins(url){
      sb.from("user_posts").insert({user_id:currentUser.id,type:post.type,url:url||"",caption:post.cap||""}).then(function(r){if(r.error)reject(new Error(r.error.message));else resolve();});
    }
    if(post.type==="image"&&/^data:/.test(post.url||"")){
      dataUrlToJpeg(post.url,1600,function(blob){
        if(!blob){reject(new Error("画像を読み込めませんでした"));return;}
        var path=currentUser.id+"/"+Date.now()+"_"+Math.random().toString(36).slice(2,7)+".jpg";
        sb.storage.from("posts").upload(path,blob,{contentType:"image/jpeg"}).then(function(ur){
          if(ur.error){reject(new Error(ur.error.message));return;}
          ins(sb.storage.from("posts").getPublicUrl(path).data.publicUrl);
        });
      });
    }else ins(post.url);
  });
}
function loadUserPosts(){
  if(typeof sb==="undefined"||!sb)return;
  sb.from("user_posts").select("id,user_id,type,url,caption,created_at").order("created_at",{ascending:false}).limit(500).then(function(r){
    if(r.error){console.error("user_posts load error",r.error.message||r.error);return;}
    var by={};(r.data||[]).forEach(function(x){(by[x.user_id]=by[x.user_id]||[]).push({id:x.id,type:x.type,url:x.url,cap:x.caption||"",likes:0,server:true});});
    for(var i=0;i<USERS.length;i++){if(USERS[i].isReal&&USERS[i].uid)USERS[i].posts=by[USERS[i].uid]||[];}
    if(currentUser&&S.myProfile){
      var local=(S.myProfile.posts||[]).filter(function(p){return !p.server;});
      S.myProfile.posts=(by[currentUser.id]||[]).concat(local);
      // 端末にだけ残っている投稿は、自動でサーバーに移す（1回だけ）
      if(local.length&&!S._migratingPosts){
        S._migratingPosts=true;
        var chain=Promise.resolve(),done=0;
        local.slice().reverse().forEach(function(p){chain=chain.then(function(){return savePostToServer(p).then(function(){done++;});}).catch(function(e){console.error("post migrate",e);});});
        chain.then(function(){S._migratingPosts=false;if(done){S.myProfile.posts=(S.myProfile.posts||[]).filter(function(p){return p.server;});saveD();loadUserPosts();}});
      }
    }
    render();
  });
}
function deleteMyPost(post){
  if(!confirm("この投稿を削除しますか？"))return;
  if(!post.server){S.myProfile.posts=(S.myProfile.posts||[]).filter(function(p){return p!==post;});saveD();render();return;}
  sb.from("user_posts").delete().eq("id",post.id).then(function(r){
    if(r.error){alert("削除できませんでした: "+r.error.message);return;}
    var m=String(post.url||"").split("/object/public/posts/")[1];
    if(m)sb.storage.from("posts").remove([decodeURIComponent(m.split("?")[0])]);
    loadUserPosts();
  });
}

function mk(tag,a,ch){
  var e=document.createElement(tag);
  if(a){var k=Object.keys(a);for(var i=0;i<k.length;i++){var kk=k[i],v=a[kk];
    if(kk==="class")e.className=v;
    else if(kk==="style"&&typeof v==="object"){var sk=Object.keys(v);for(var j=0;j<sk.length;j++)e.style[sk[j]]=v[sk[j]];}
    else if(kk==="onClick")e.addEventListener("click",v);
    else if(kk==="type")e.type=v;
    else if(kk==="accept")e.accept=v;
    else if(kk==="src")e.src=v;
    else if(kk==="rows")e.rows=v;
    else if(kk==="disabled")e.disabled=v;
    else if(kk==="checked")e.checked=v;
    else if(kk==="controls"&&v)e.setAttribute("controls","");
    else if(kk==="playsInline"&&v){e.setAttribute("playsinline","");e.setAttribute("webkit-playsinline","");}
    else if(kk==="preload")e.setAttribute("preload",v);
    else e.setAttribute(kk,v);

  if(ch){for(var ci=0;ci<ch.length;ci++){var c=ch[ci];if(c==null||c===false)continue;if(typeof c==="string")e.appendChild(document.createTextNode(c));else e.appendChild(c);}}

}

    S.notifs=S.notifs.filter(function(n){return String(n.id).indexOf("rv_")!==0;});

  if(!S.liked)S.liked=[];

  var adding=idx<0;
  if(adding){
    S.liked.push(u.id);u.likes=(u.likes||0)+1;
    if(!S.notifs)S.notifs=[];
    S.notifs.unshift({id:"n"+Date.now(),type:"like",icon:"❤️",msg:"あなたが"+u.name+"にいいねしました",time:"今",read:true});
  }else{
    S.liked.splice(idx,1);u.likes=Math.max(0,(u.likes||0)-1);
    if(S.mutual){var mi=S.mutual.indexOf(u.id);if(mi>=0)S.mutual.splice(mi,1);}

// ===== チャット（Supabase: dm_messages） =====
function hmOf(d){d=d?new Date(d):new Date();return d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");}
function canMessage(u){
  if(!u)return false;
  if(S.mutual&&S.mutual.indexOf(u.id)>=0)return true;          // マッチ
  if(S.following&&S.following.indexOf(u.id)>=0)return true;    // 自分がフォロー
  if(S.followers&&S.followers.indexOf(u.id)>=0)return true;    // 相手が自分をフォロー（返信できるように）
  return false;
}
function sendMsg(text){if(S.isGuest){guestPrompt();return;}
  var u=S.chatUser;if(!u)return;
  var body=(text!==undefined?text:(S.chatIn||"")).trim();
  if(!body)return;
  var cid=String(u.id);if(!S.chatMsgs[cid])S.chatMsgs[cid]=[];
  if(u.isReal){
    if(!sb||!currentUser){alert("メッセージを送るにはログインが必要です");return;}
    if(!canMessage(u)){alert("メッセージを送るには、相手をフォローしてください（お互いにいいねしてマッチした相手にも送れます）");return;}
    var tmp={f:"m",t:body,time:hmOf(),pending:true};
    S.chatMsgs[cid].push(tmp);S.chatIn="";render();
    var _ci=document.getElementById("chatinput");if(_ci)_ci.focus();
    sb.from("dm_messages").insert({from_user:currentUser.id,to_user:u.uid,body:body}).select().single().then(function(r){
      if(r.error){tmp.t=body+"（送信失敗）";render();alert("送信に失敗しました: "+r.error.message);return;}
      tmp.pending=false;tmp.id=r.data.id;
    });
    return;
  }
  S.chatMsgs[cid].push({f:"m",t:body,time:hmOf()});S.chatIn="";saveD();render();
}
function loadMessagesFromSupabase(){
  if(!sb||!currentUser)return;
  sb.from("dm_messages").select("id,from_user,to_user,body,image_path,created_at,read_at").or("from_user.eq."+currentUser.id+",to_user.eq."+currentUser.id).order("created_at",{ascending:true}).limit(1000).then(function(r){
    if(r.error){console.error("messages load error",r.error);return;}
    for(var k in S.chatMsgs){if(k.indexOf("sb_")===0)delete S.chatMsgs[k];}
    var rows=r.data||[];
    for(var i=0;i<rows.length;i++)addDmRow(rows[i],false);
    render();
  });
}
function addDmRow(row,live){
  var mine=row.from_user===currentUser.id;
  var other=mine?row.to_user:row.from_user;
  var cid="sb_"+other;if(!S.chatMsgs[cid])S.chatMsgs[cid]=[];
  var list=S.chatMsgs[cid];
  for(var j=0;j<list.length;j++){if(list[j].id===row.id){if(row.read_at)list[j].readAt=row.read_at;return;}}
  if(live&&mine){for(var j2=list.length-1;j2>=0;j2--){if(list[j2].pending&&list[j2].t===row.body&&(list[j2].img||null)===(row.image_path||null)){list[j2].pending=false;list[j2].id=row.id;return;}}}
  list.push({id:row.id,f:mine?"m":"t",t:row.body,img:row.image_path||null,time:hmOf(row.created_at),readAt:row.read_at||null});
  if(live&&!mine){
    var u=findRealUser(other);var nm=u?u.name:"だれか";
    if(!S.notifs)S.notifs=[];
    if(!(S.tab==="chat"&&S.chatUser&&S.chatUser.id===cid))S.unreadChat=(S.unreadChat||0)+1;
  }
}
function hasChatWith(uid){var l=S.chatMsgs["sb_"+uid];return !!(l&&l.length);}
// 通知の既読を端末に保存（アプリを開き直しても既読のまま）
function nReadKey(){return "sm_nread_"+(currentUser?currentUser.id:"guest");}
function nReadMap(){try{return JSON.parse(localStorage.getItem(nReadKey())||"{}")||{};}catch(e){return {};}}
function isNotifRead(id){return !!nReadMap()[id];}
function saveNotifsRead(list){
  var m=nReadMap();
  for(var i=0;i<list.length;i++){if(list[i]&&list[i].id!=null)m[list[i].id]=1;}
  var ks=Object.keys(m);if(ks.length>400){for(var j=0;j<ks.length-400;j++)delete m[ks[j]];}
  try{localStorage.setItem(nReadKey(),JSON.stringify(m));}catch(e){}
}
function visibleNotifs(){
  var m=nReadMap();
  return (S.notifs||[]).filter(function(n){if(m[n.id])n.read=true;return !(n.type==="match"&&n.uid&&hasChatWith(n.uid));});
}
function unreadChatItems(){
  var out=[];
  for(var k in S.chatMsgs){
    if(!S.chatMsgs.hasOwnProperty(k)||k.indexOf("sb_")!==0)continue;
    var n=unreadCountFor(k);if(!n)continue;
    var list=S.chatMsgs[k],last=null;
    for(var i=list.length-1;i>=0;i--){if(list[i].f==="t"){last=list[i];break;}}
    var u=findRealUser(k.slice(3));
    out.push({user:u,cid:k,count:n,last:last});
  }
  return out;
}
function unreadCountFor(cid){
  if(String(cid).indexOf("sb_")!==0)return 0;
  var list=S.chatMsgs[cid]||[],n=0;
  for(var i=0;i<list.length;i++){if(list[i].f==="t"&&!list[i].readAt)n++;}
  return n;
}
function totalUnreadChat(){
  var n=0;for(var k in S.chatMsgs){if(S.chatMsgs.hasOwnProperty(k))n+=unreadCountFor(k);}
  return n;
}
function unreadBadge(n,extra){
  var b=document.createElement("div");
  b.style.cssText="background:#FF3B30;color:#fff;border-radius:10px;min-width:18px;height:18px;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 5px;"+(extra||"");
  b.textContent=n>99?"99+":String(n);return b;
}
function markChatRead(u,msgs){
  if(!sb||!currentUser||!u||!u.isReal||!u.uid)return;
  var need=false,now=new Date().toISOString();
  for(var i=0;i<msgs.length;i++){if(msgs[i].f==="t"&&!msgs[i].readAt){msgs[i].readAt=now;need=true;}}
  if(!need)return;
  sb.from("dm_messages").update({read_at:now}).eq("from_user",u.uid).eq("to_user",currentUser.id).is("read_at",null).then(function(r){if(r.error)console.error("mark read error",r.error);});
}
var _rtChannel=null;
function startRealtime(){
  if(!sb||!currentUser||_rtChannel)return;
  _rtChannel=sb.channel("sm-"+currentUser.id)
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"dm_messages",filter:"to_user=eq."+currentUser.id},function(p){addDmRow(p.new,true);render();})
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"dm_messages",filter:"from_user=eq."+currentUser.id},function(p){addDmRow(p.new,true);render();})
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"dm_messages",filter:"from_user=eq."+currentUser.id},function(p){addDmRow(p.new,false);render();})
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"user_likes",filter:"to_user=eq."+currentUser.id},function(){loadLikesFromSupabase();})
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"user_follows",filter:"followee=eq."+currentUser.id},function(){loadFollowsFromSupabase();})
    .on("postgres_changes",{event:"*",schema:"public",table:"reservations",filter:"provider=eq."+currentUser.id},function(){loadReservations();})
    .on("postgres_changes",{event:"*",schema:"public",table:"reservations",filter:"customer=eq."+currentUser.id},function(){loadReservations();})
    .on("postgres_changes",{event:"*",schema:"public",table:"profiles"},function(){loadUsersFromSupabase();})
    .subscribe();
}

function signUpToSupabase(){
  if(!sb){
    alert("接続エラー：Supabaseが初期化されていません");
    finishLocalRegistration();
    return;
  }
  var email=(S.reg.email||"").trim();
  var pw=S.reg.pw||"";
  if(!email||!pw){
    alert("メールアドレスとパスワードが必要です");
    finishLocalRegistration();
    return;
  }
  sb.auth.signUp({email:email,password:pw}).then(function(res){
    if(res.error){
      // 既に登録済みメールの場合はログインを試す
      if(res.error.message && res.error.message.indexOf("already")>=0){
