function shrinkImage(file,maxSide,cb){
  var fr=new FileReader();
  fr.onload=function(ev){
    var im=new Image();
    im.onload=function(){
      var w=im.width,h=im.height,sc=Math.min(1,maxSide/Math.max(w,h));
      var cv=document.createElement("canvas");cv.width=Math.round(w*sc);cv.height=Math.round(h*sc);
      cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
      cv.toBlob(function(bl){cb(bl,cv.toDataURL("image/jpeg",0.6));},"image/jpeg",0.82);
    };
    im.onerror=function(){alert("この画像は読み込めませんでした");};
    im.src=ev.target.result;
  };
  fr.readAsDataURL(file);
}

function dataUrlToJpeg(dataUrl,maxSide,cb){
  var im=new Image();
  im.onload=function(){var w=im.width,h=im.height,sc=Math.min(1,maxSide/Math.max(w,h));var cv=document.createElement("canvas");cv.width=Math.round(w*sc);cv.height=Math.round(h*sc);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);cv.toBlob(function(bl){cb(bl);},"image/jpeg",0.85);};
  im.onerror=function(){cb(null);};
  im.src=dataUrl;
}
function savePostToServer(post){
  return new Promise(function(resolve,reject){
    function ins(url){
      sb.from("user_posts").insert({user_id:currentUser.id,type:post.type,url:url||"",caption:post.cap||""}).then(function(r){if(r.error)reject(new Error(r.error.message));else resolve();});
    }
    if(post.type==="image"&&/^data:/.test(post.url||"")){
      dataUrlToJpeg(post.url,1600,function(blob){
        if(!blob){reject(new Error("画像を読み込めませんでした"));return;}
        var path=currentUser.id+"/"+Date.now()+"_"+Math.random().toString(36).slice(2,7)+".jpg";
        sb.storage.from("posts").upload(path,blob,{contentType:"image/jpeg"}).then(function(ur){
          if(ur.error){reject(new Error(ur.error.message));return;}
          ins(sb.storage.from("posts").getPublicUrl(path).data.publicUrl);
        });
      });
    }else ins(post.url);
  });
}
function loadUserPosts(){

    var by={};(r.data||[]).forEach(function(x){(by[x.user_id]=by[x.user_id]||[]).push({id:x.id,type:x.type,url:x.url,cap:x.caption||"",likes:0,server:true});});
    for(var i=0;i<USERS.length;i++){if(USERS[i].isReal&&USERS[i].uid)USERS[i].posts=by[USERS[i].uid]||[];}
    if(currentUser&&S.myProfile){

      S.myProfile.posts=(by[currentUser.id]||[]).concat(local);

      if(local.length&&!S._migratingPosts){
        S._migratingPosts=true;
        var chain=Promise.resolve(),done=0;
        local.slice().reverse().forEach(function(p){chain=chain.then(function(){return savePostToServer(p).then(function(){done++;});}).catch(function(e){console.error("post migrate",e);});});
        chain.then(function(){S._migratingPosts=false;if(done){S.myProfile.posts=(S.myProfile.posts||[]).filter(function(p){return p.server;});saveD();loadUserPosts();}});
      }
    }
    render();

}

    else if(kk==="accept")e.accept=v;
    else if(kk==="src")e.src=v;
    else if(kk==="rows")e.rows=v;
    else if(kk==="disabled")e.disabled=v;
    else if(kk==="checked")e.checked=v;
    else if(kk==="controls"&&v)e.setAttribute("controls","");

function svc(url){

  if(url.indexOf("tiktok.com")>=0)return{icon:"🎵",name:"TikTok",bg:"linear-gradient(135deg,#010101,#69C9D0)"};
  if(url.indexOf("youtube.com")>=0||url.indexOf("youtu.be")>=0)return{icon:"▶️",name:"YouTube",bg:"linear-gradient(135deg,#FF0000,#CC0000)"};
  if(url.indexOf("instagram.com")>=0)return{icon:"📸",name:"Instagram",bg:"linear-gradient(135deg,#833AB4,#FD1D1D)"};
  if(url.indexOf("twitter.com")>=0||url.indexOf("x.com")>=0)return{icon:"✖️",name:"X",bg:"#000"};
  if(url.indexOf("vimeo.com")>=0)return{icon:"🎬",name:"Vimeo",bg:"#1AB7EA"};
  return{icon:"🎬",name:"動画を見る",bg:"linear-gradient(135deg,#FF6B2B,#FF8C55)"};
}

  ["ゲストでも使える？","「ゲストとして見る」から、登録なしで仲間探しや募集掲示板、タイムラインなどを見られます。メッセージ・予約・参加・書き込みなどをするには無料登録が必要です。"]

  ["本人確認は必要？","次のことをするには本人確認（身分証の提出）が必要です。\n・お金を受け取る（有料で同行・撮影する、有料の募集に参加する）\n・ラウンジの会員限定の部屋を使う\n\n無料で仲間を探すだけなら本人確認なしでも使えます。本人確認済みの人には「確認済」マークが付くので、相手選びの安心材料になります。"],
  ["本人確認のやり方は？","マイページから本人確認を申請し、身分証の写真を提出します。運営が確認して承認すると「確認済」になります。結果はアプリ内の通知でお知らせします。"],
  ["プロフィールで大事なところは？","アイコン写真・自己紹介・活動スキー場・レベルを入れておくと、相手が安心して声をかけやすくなります。有料で同行する人は、料金と、滑りや撮影の動画（投稿・実績）を載せるのがおすすめです。"]
 ]},
 {sec:"🏂 アプリの使い方",items:[
  ["仲間はどうやって探すの？","「ホーム」→「仲間を探す」で、エリア・種目・レベルなどで絞り込めます。気になる人がいたらプロフィールを見て、フォローやメッセージをしてみましょう。\n撮影してくれる人を探すときは「ホーム」→「撮影カメラマン」から、使っている機材やエリアで絞り込めます。"],
  ["募集掲示板って何？","日付つきで投稿できる掲示板です。\n・「同行・撮影します」：この日空いているので一緒に滑れる・撮影できます、という投稿\n・「同行・撮影お願いします」：この日一緒に滑る人・撮影してくれる人を探しています、という投稿\nそれぞれ「無料」か「有料」を選べます。"],
  ["「参加します」を押すとどうなる？","【無料の投稿】相手に「参加したいです！」というメッセージが自動で届き、チャットで日時や集合場所を決めます。\n\n【有料の募集】応募として相手に届きます。募集した人が応募者の中から1人を選ぶと予約が確定します。確定するまでは何人でも応募でき、選ばれなかった人には自動でお知らせが届きます。"],
  ["メッセージは誰にでも送れる？","フォローした相手にメッセージを送れます。プロフィールの「メッセージ」や、募集の「参加します」「質問」から送ると、自動でフォローされます。"],
  ["ラウンジでは何ができる？","・タイムライン：誰でも見られるひとこと投稿（自分の投稿はマイページに日付つきで残り、返信もできます）\n・ゲレンデ速報：今日の雪質・天気・混み具合を写真つきで共有（毎日0時にリセット）\n・会員ページ：本人確認済みの人だけの部屋（雑談部屋・悩み相談・Q&A）。メッセージを長押しすると返信でき、写真や動画も送れます。"]

 {sec:"💴 料金とお支払いの流れ",items:[
  ["アプリの利用料は？","登録・仲間探し・メッセージ・無料の募集などは、すべて無料です。お金がかかるのは、有料の同行・撮影をお願いするときだけです。"],
  ["有料の同行をお願いする流れは？","【相手のプロフィールから予約する場合】\n① 相手の料金（1時間／半日／1日）を見て「予約する」\n② 日付・時間・プランを選んで申し込み、支払う\n③ 相手が承認すると予約確定\n\n【募集掲示板で募集する場合】\n① 「同行・撮影お願いします」＋「有料」で、払う金額を決めて投稿\n② 「参加します」と応募してくれた人から1人を選ぶ\n③ 支払い画面で支払うと予約確定"],
  ["表示の料金に何が含まれる？","表示の料金は「全部込み」の金額です。同行謝礼・食事代・交通費・リフト券代が含まれます。宿泊費・撮影機材費は各自負担です。予約時に支払うのは表示の金額だけで、追加の手数料はかかりません。"],

  ["お金をもらうこともできる？","できます。自分のプロフィールに同行・撮影の料金を設定しておくと、予約が入ったときに受け取れます。また「同行・撮影お願いします」の投稿に応募して参加した場合も、募集者が出した金額を受け取れます（受け取るには本人確認が必要です）。"],
  ["キャンセルしたらどうなる？","・前日までのキャンセル：全額返金\n・当日のキャンセル：料金の100%\n・悪天候・リフト運休・相手側の都合の場合：全額返金"],
  ["当日なにかトラブルがあったら？","マイページの「お問い合わせ」から、できるだけ早く運営に知らせてください。相手への送金前であれば、運営が双方に確認して対応します。"],

 {sec:"🛡 安全に使うために",items:[

function loadProfileFromSupabase(){
  if(!sb||!currentUser){S.showLoginModal=false;render();return;}
  sb.from("profiles").select("*").eq("id",currentUser.id).single().then(function(res){
    if(res.error||!res.data){
      if(window._profTried){alert("プロフィールを読み込めませんでした: "+(res.error?res.error.message:"データなし"));S.showLoginModal=false;render();return;}
      window._profTried=true;
      createProfileFromLocal();
      return;
    }
    var p=res.data;
    S.myProfile={
      uid:p.id,nick:p.nick,name:p.real_name,age:p.age,gender:p.gender||"",email:p.email,
      act:fixCam(p.act),acts:fixCam(p.acts||[]),lv:p.lv,resorts:fixResort(p.resorts||[]),bio:p.bio,
      icon:p.icon||"🏂",profileImg:p.profile_img,isIns:p.is_ins,isCam:p.is_cam,
      price:p.price,unit:p.unit,gear:p.gear||[],sns:p.sns||{},
      priceHour:pfr(p,"hour"),priceHalf:pfr(p,"half"),priceDay:pfr(p,"day"),
      ok:p.is_verified,kycStatus:p.kyc_status,birthDate:p.birth_date||null
    };
    if(p.extra){for(var ek in p.extra){if(p.extra.hasOwnProperty(ek))S.myProfile[ek]=p.extra[ek];}}
    saveD();
    S.showLoginModal=false;
    loadUsersFromSupabase();
    R({pg:"main",tab:"explore"});
  }).catch(function(e){
    console.error(e);
    S.showLoginModal=false;render();
  });
}

// ログイン時にプロフィールが無ければ、端末内の登録データから作成する
function createProfileFromLocal(){
  var src={};
  try{var raw=localStorage.getItem("sm2");if(raw){var dt=JSON.parse(raw);src=dt.myProfile||{};if(dt.reg){for(var k in dt.reg){if(src[k]===undefined)src[k]=dt.reg[k];}}}}catch(e){}
  if(S.myProfile){for(var k2 in S.myProfile){if(S.myProfile[k2]!==undefined&&S.myProfile[k2]!=="")src[k2]=S.myProfile[k2];}}
  if(S.reg){var rk=["nick","age","act","lv","bio","icon"];for(var ri=0;ri<rk.length;ri++){if(!src[rk[ri]]&&S.reg[rk[ri]])src[rk[ri]]=S.reg[rk[ri]];}if(!src.resorts||!src.resorts.length)src.resorts=S.reg.resorts||[];if(!src.name&&S.reg.real)src.name=S.reg.real;}
  var row={
    id: currentUser.id,
    nick: src.nick||"",
    real_name: src.name||src.real||"",
    age: src.age?parseInt(src.age):null,
    email: currentUser.email||src.email||"",
    act: src.act||"",
    acts: src.acts||[],
    lv: src.lv||"中級",
    resorts: src.resorts||[],
    bio: src.bio||"",
    icon: src.icon||"🏂"
  };
  sb.from("profiles").upsert(row).then(function(r){
    if(r.error){alert("プロフィール保存エラー: "+r.error.message);S.showLoginModal=false;render();return;}
    loadProfileFromSupabase();
  }).catch(function(e){
    alert("プロフィール保存エラー: "+(e&&e.message?e.message:e));
    S.showLoginModal=false;render();
  });
}

// ===== チャット（Supabase: dm_messages） =====
function hmOf(d){d=d?new Date(d):new Date();return d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");}
function canMessage(u){
  if(!u)return false;
  if(S.mutual&&S.mutual.indexOf(u.id)>=0)return true;          // マッチ
  if(S.following&&S.following.indexOf(u.id)>=0)return true;    // 自分がフォロー
  if(S.followers&&S.followers.indexOf(u.id)>=0)return true;    // 相手が自分をフォロー（返信できるように）
  return false;
}
function sendMsg(text){if(S.isGuest){guestPrompt();return;}
  var u=S.chatUser;if(!u)return;
  var body=(text!==undefined?text:(S.chatIn||"")).trim();
  if(!body)return;
  var cid=String(u.id);if(!S.chatMsgs[cid])S.chatMsgs[cid]=[];
  if(u.isReal){
    if(!sb||!currentUser){alert("メッセージを送るにはログインが必要です");return;}
    if(!canMessage(u)){alert("メッセージを送るには、相手をフォローしてください（お互いにいいねしてマッチした相手にも送れます）");return;}
    var tmp={f:"m",t:body,time:hmOf(),pending:true};
    S.chatMsgs[cid].push(tmp);S.chatIn="";
    var _ci=document.getElementById("chatinput");
    if(chatOpenFor(cid)){appendDmRow(tmp);if(_ci){_ci.value="";fitChatInput(_ci);_ci.focus();}}else{render();}
    sb.from("dm_messages").insert({from_user:currentUser.id,to_user:u.uid,body:body}).select().single().then(function(r){
      if(r.error){tmp.t=body+"（送信失敗）";tmp.pending=false;if(chatOpenFor(cid))refreshDmRow(tmp);else render();alert("送信に失敗しました: "+r.error.message);return;}
      tmp.pending=false;tmp.id=r.data.id;clearTimeout(window._dmCacheT);window._dmCacheT=setTimeout(saveDmCache,800);
    });
    return;
  }
  S.chatMsgs[cid].push({f:"m",t:body,time:hmOf()});S.chatIn="";saveD();render();
}
// メッセージは端末にも保存しておき、アプリを開いた瞬間にまず表示 → そのあとサーバーの最新と入れ替える
function dmCacheKey(){return "sm_dmc_"+(currentUser?currentUser.id:"");}
function saveDmCache(){
  if(!currentUser||!window._dmLoadedAt)return;
  try{
    var out={};
    for(var k in S.chatMsgs){if(!S.chatMsgs.hasOwnProperty(k)||k.indexOf("sb_")!==0)continue;
      out[k]=S.chatMsgs[k].filter(function(m){return m.id&&!m.pending;}).slice(-80).map(function(m){return {id:m.id,f:m.f,t:m.t,img:m.img||null,time:m.time,readAt:m.readAt||null};});}
    localStorage.setItem(dmCacheKey(),JSON.stringify(out));
  }catch(e){}
}
function restoreDmCache(){
  if(!currentUser)return false;
  if(window._dmRestoredFor!==currentUser.id){
    window._dmRestoredFor=currentUser.id;
    var c0=null;try{c0=JSON.parse(localStorage.getItem(dmCacheKey())||"null");}catch(e){}
    if(c0&&Object.keys(c0).length){for(var kx in S.chatMsgs){if(kx.indexOf("sb_")===0)delete S.chatMsgs[kx];}for(var ky in c0){if(c0.hasOwnProperty(ky))S.chatMsgs[ky]=c0[ky];}return true;}
    return false;
  }
  for(var k0 in S.chatMsgs){if(k0.indexOf("sb_")===0&&S.chatMsgs[k0].length)return false;}
  try{var c=JSON.parse(localStorage.getItem(dmCacheKey())||"null");if(!c)return false;
    for(var k in c){if(c.hasOwnProperty(k))S.chatMsgs[k]=c[k];}return true;}catch(e){return false;}
}
function loadMessagesFromSupabase(force,tries){
  if(!sb||!currentUser){window._dmLastErr=!sb?"サーバーに接続できません":"ログイン情報を確認中です";return;}
  var now=Date.now();tries=tries||0;
  if(!force&&window._dmLoadedAt&&now-window._dmLoadedAt<20000)return;
  if(window._dmLoading&&now-(window._dmLoadingAt||0)<12000)return; // 応答がない読み込みで止まり続けないようにする
  window._dmLoading=true;window._dmLoadingAt=now;
  try{localStorage.setItem("sm_last_uid",currentUser.id);}catch(e){}
  var att=(window._dmAtt=(window._dmAtt||0)+1);
  function retry(){if(window._dmAtt!==att)return;window._dmLoading=false;if(tries<6)setTimeout(function(){loadMessagesFromSupabase(true,tries+1);},1500*(tries+1));if(S.chatUser&&!(S.chatMsgs[String(S.chatUser.id)]||[]).length)render();}
  setTimeout(function(){if(window._dmLoading&&window._dmAtt===att){console.warn("messages load slow, retrying");window._dmLastErr="応答がありません（タイムアウト）";window._dmLoading=false;if(tries<6)loadMessagesFromSupabase(true,tries+1);else render();}},7000);
  if(restoreDmCache())render();
  // 新しい順に取ってから並べ直す（古い順だと件数が多いときに最新のメッセージが漏れるため）
  // ログインの鍵が切れかけていたら先に更新してから取る（鍵なしで取ると0件が返ってくるため）
  sb.auth.getSession().then(function(rs){
    var ses=rs&&rs.data&&rs.data.session;
    if(!ses){window._dmLastErr="ログイン情報を確認中です";retry();return null;}
    var exp=(ses.expires_at||0)*1000;
    if(exp&&exp-Date.now()<90000)return sb.auth.refreshSession().then(function(){return true;},function(){return true;});
    return true;
  }).then(function(ok){
    if(!ok)return;
    return sb.from("dm_messages").select("id,from_user,to_user,body,image_path,created_at,read_at").or("from_user.eq."+currentUser.id+",to_user.eq."+currentUser.id).order("created_at",{ascending:false}).limit(2000);
  }).then(function(r){
    if(!r)return;
    if(window._dmAtt!==att&&window._dmLoadedAt&&window._dmLoadedAt>now)return;
    window._dmLoading=false;
    if(r.error){console.error("messages load error",r.error);window._dmLastErr=r.error.message||String(r.error.code||"error");retry();return;}
    // 手元にメッセージがあるのに0件が返ってきたら、通信の不調とみなして消さずにやり直す
    var hadAny=false;for(var hk in S.chatMsgs){if(hk.indexOf("sb_")===0&&S.chatMsgs[hk].some(function(m){return !!m.id;})){hadAny=true;break;}}
    if(!(r.data&&r.data.length)&&!window._dmZeroRetried){window._dmZeroRetried=true;window._dmLastErr="確認中";retry();return;}
    if(!(r.data&&r.data.length)&&hadAny&&tries<6){console.warn("messages: got 0 rows, retrying");window._dmLastErr="サーバーから空の応答（再試行中）";retry();return;}
    window._dmLastErr=null;
    var _openCid=S.chatUser?String(S.chatUser.id):null;
    function _sig(){var l=_openCid&&S.chatMsgs[_openCid]||[];return l.map(function(m){return (m.id||"p")+":"+(m.readAt?1:0);}).join(",");}
    var _before=_sig();var _wasLoaded=!!window._dmLoadedAt;
    window._dmLoadedAt=Date.now();
    var keep={},kmap={};
    for(var k in S.chatMsgs){if(k.indexOf("sb_")!==0)continue;S.chatMsgs[k].forEach(function(m){if(m.id&&m._k)kmap[m.id]=m._k;});keep[k]=S.chatMsgs[k].filter(function(m){return m.pending||(!m.id&&m.preview);});delete S.chatMsgs[k];}
    var rows=(r.data||[]).slice().reverse();
    for(var i=0;i<rows.length;i++)addDmRow(rows[i],false);
    for(var kk in S.chatMsgs){if(kk.indexOf("sb_")===0)S.chatMsgs[kk].forEach(function(m){if(m.id&&kmap[m.id])m._k=kmap[m.id];});}
    for(var k2 in keep){if(!keep[k2].length)continue;if(!S.chatMsgs[k2])S.chatMsgs[k2]=[];keep[k2].forEach(function(m){S.chatMsgs[k2].push(m);});}
    saveDmCache();
    // 開いているチャットの中身が変わっていなければ描き直さない（ブルブル防止）
    if(_openCid&&_wasLoaded&&_sig()===_before&&chatOpenFor(_openCid))return;
    if(_openCid&&chatOpenFor(_openCid)&&_before&&_sig().indexOf(_before)===0){

function signUpToSupabase(){
  if(!sb){
    alert("接続エラー：Supabaseが初期化されていません");
    finishLocalRegistration();
    return;
  }
  var email=(S.reg.email||"").trim();
  var pw=S.reg.pw||"";
  if(!email||!pw){
    alert("メールアドレスとパスワードが必要です");
    finishLocalRegistration();
    return;
  }
  sb.auth.signUp({email:email,password:pw}).then(function(res){
    if(res.error){
      // 既に登録済みメールの場合はログインを試す
      if(res.error.message && res.error.message.indexOf("already")>=0){
        sb.auth.signInWithPassword({email:email,password:pw}).then(function(res2){
          if(res2.error){alert("登録エラー: "+res2.error.message);finishLocalRegistration();return;}
          currentUser=res2.data.user;S.isGuest=false;
          saveProfileToSupabase();
        });
        return;
      }
      alert("登録エラー: "+res.error.message);
      finishLocalRegistration();
      return;
    }
    if(!res.data.session){
      // メール確認が必要：ログインはまだ完了していないので、確認後にログインしてもらう
      currentUser=null;
      try{var raw0=localStorage.getItem("sm2");var dt0=raw0?JSON.parse(raw0):{};dt0.reg=S.reg;localStorage.setItem("sm2",JSON.stringify(dt0));}catch(e){}
      alert("確認メールを送りました📧\n\n"+email+" に届いたメールの「Confirm email address」を押してから、このあと開くログイン画面で、登録したメールアドレスとパスワードでログインしてください。\n\n※メールが見つからないときは迷惑メールフォルダも確認してください。");
      S.myProfile=null;R({pg:"splash",showLoginModal:true});
      return;
    }
    currentUser=res.data.user;S.isGuest=false;
    saveProfileToSupabase();
  }).catch(function(e){
    console.error(e);
    finishLocalRegistration();
  });
}

// マイページの見出し・ボタンの先頭の絵文字を外す（⚠️注意・✅/🪪/⏳の状態の印は残す。絵文字だけのアイコンや投稿の中身はそのまま）
var KEEP_EMOJI=["⚠","✅","🪪","⏳"];
var LEAD_EMOJI=null;try{LEAD_EMOJI=new RegExp("^\\s*((?:\\p{Extended_Pictographic}|\\p{Regional_Indicator})(?:\\uFE0F|\\u200D(?:\\p{Extended_Pictographic})|[\\u{1F3FB}-\\u{1F3FF}])*\\uFE0F?)\\s*","u");}catch(e){LEAD_EMOJI=null;}
function stripLabelEmoji(root){
  if(!LEAD_EMOJI)return root;
  try{
    var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);var list=[];var n;
    while((n=w.nextNode()))list.push(n);
    list.forEach(function(t){
      var el=t.parentNode;if(!el)return;
      if(el.closest&&(el.closest(".pcard")||el.closest("textarea")||el.closest("[data-keep-emoji]")))return;
      var v=t.nodeValue;var m=v.match(LEAD_EMOJI);if(!m)return;
      var rest=v.slice(m[0].length);
      for(var i=0;i<KEEP_EMOJI.length;i++){if(m[1].indexOf(KEEP_EMOJI[i])===0)return;}
      if(!rest.trim()){
        // ボタンの中で「絵文字だけのspan＋文字」になっている場合は絵文字のspanを外す。それ以外の絵文字だけのアイコンは残す
        var pb=el.parentNode;
        if(el.tagName==="SPAN"&&pb&&pb.tagName==="BUTTON"&&pb.textContent.replace(v,"").trim()){pb.removeChild(el);}
        return;
      }
      t.nodeValue=rest;
    });
  }catch(e){}
  return root;
}
